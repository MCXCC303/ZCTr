<groupbox
        onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
    <hbox flex="1" style="min-height: 400px">
        <!-- 左栏：供应商列表 -->
        <vbox style="width: 260px; margin-right: 12px">
            <label>
                <html:h3>供应商</html:h3>
            </label>
            <html:div
                    id="zctr-provider-list"
                    style="
          flex: 1;
          border: 1px solid var(--fill-quaternary, #ccc);
          border-radius: 6px;
          padding: 4px;
          overflow-y: auto;
          min-height: 200px;
        "
            ></html:div>
            <button
                    id="zctr-btn-add"
                    label="添加供应商"
                    style="margin-top: 8px"
            />
        </vbox>

        <!-- 右栏：供应商表单 -->
        <vbox flex="1">
            <label>
                <html:h3>供应商配置</html:h3>
            </label>

            <label>供应商类型</label>
            <html:select id="zctr-input-type" style="width: 100%">
                <html:option value="openai">OpenAI 兼容</html:option>
                <html:option value="deepseek">DeepSeek</html:option>
                <html:option value="ollama">Ollama</html:option>
            </html:select>

            <label style="margin-top: 8px">名称</label>
            <html:input
                    id="zctr-input-name"
                    placeholder="如: 我的 DeepSeek / 本地 Ollama"
                    style="width: 100%"
            />

            <!-- OpenAI 兼容：API Base URL -->
            <vbox id="zctr-field-baseurl">
                <label style="margin-top: 8px">API Base URL</label>
                <html:input
                        id="zctr-input-baseurl"
                        placeholder="https://api.openai.com/v1"
                        style="width: 100%"
                />
            </vbox>

            <!-- DeepSeek：模型下拉 -->
            <vbox id="zctr-field-model-select">
                <label style="margin-top: 8px">模型</label>
                <html:select id="zctr-input-model-select" style="width: 100%">
                    <html:option value="deepseek-v4-pro">deepseek-v4-pro</html:option>
                    <html:option value="deepseek-v4-flash">deepseek-v4-flash</html:option>
                </html:select>
            </vbox>

            <!-- OpenAI 兼容：模型文本输入 -->
            <vbox id="zctr-field-model">
                <label style="margin-top: 8px">模型</label>
                <html:input
                        id="zctr-input-model"
                        placeholder="如: gpt-4o-mini"
                        style="width: 100%"
                />
            </vbox>

            <!-- Ollama：模型下拉（测试连接后启用） -->
            <vbox id="zctr-field-model-ollama" hidden="true">
                <label style="margin-top: 8px">模型</label>
                <html:select id="zctr-input-model-ollama" disabled="disabled" style="width: 100%">
                    <html:option value="">请先测试连接</html:option>
                </html:select>
            </vbox>

            <!-- Ollama：端口 + 连通性检测 -->
            <vbox id="zctr-field-port">
                <label style="margin-top: 8px">Ollama 端口</label>
                <hbox align="center">
                    <html:input
                            id="zctr-input-port"
                            type="number"
                            value="11434"
                            style="width: 120px"
                    />
                    <button
                            id="zctr-btn-test-ollama"
                            label="测试连接"
                            style="margin-left: 8px"
                    />
                </hbox>
                <label
                        id="zctr-ollama-status"
                        style="color: #888; margin-top: 4px"
                ></label>
            </vbox>

            <!-- API Key（Ollama 不需要） -->
            <vbox id="zctr-field-apikey">
                <label style="margin-top: 8px">API Key</label>
                <html:input
                        id="zctr-input-apikey"
                        type="password"
                        placeholder="sk-..."
                        style="width: 100%"
                />
            </vbox>

            <hbox style="margin-top: 16px">
                <button id="zctr-btn-save" label="保存"/>
                <button id="zctr-btn-active" label="设为激活" style="margin-left: 8px"/>
                <button id="zctr-btn-delete" label="删除" style="margin-left: 8px"/>
            </hbox>

            <separator style="margin-top: 24px"/>

            <label>
                <html:h3>翻译设置</html:h3>
            </label>
            <hbox align="center">
                <label flex="1">目标语言</label>
                <html:select id="zctr-input-targetlang" style="width: 160px">
                    <!-- Options populated by JS from TARGET_LANGUAGES -->
                </html:select>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <label flex="1">点按翻译快捷键</label>
                <html:input
                        id="zctr-input-shortcut"
                        readonly="readonly"
                        placeholder="点击后按组合键，Esc 清除"
                        style="width: 160px; text-align: center"
                />
            </hbox>
            <hbox align="center" style="margin-top: 10px">
                <html:input
                        id="zctr-input-streaming"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">使用流式输出</label>
            </hbox>

            <label style="margin-top: 16px">
                <html:h3>生成参数</html:h3>
            </label>
            <hbox align="center">
                <label flex="1">Temperature</label>
                <html:input
                        id="zctr-input-temperature"
                        type="number"
                        min="0"
                        max="2"
                        step="0.1"
                        style="width: 120px"
                />
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <label flex="1">Max output tokens</label>
                <html:input
                        id="zctr-input-max-output-tokens"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="auto"
                        style="width: 120px"
                />
            </hbox>
            <html:details style="margin-top: 8px">
                <html:summary>高级参数（仅对支持的 Provider/Model 生效）</html:summary>
                <hbox align="center" style="margin-top: 8px">
                    <label flex="1">Top P</label>
                    <html:input
                            id="zctr-input-top-p"
                            type="number"
                            min="0"
                            max="1"
                            step="0.05"
                            placeholder="默认"
                            style="width: 120px"
                    />
                </hbox>
                <hbox align="center" style="margin-top: 8px">
                    <label flex="1">Top K</label>
                    <html:input
                            id="zctr-input-top-k"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="默认"
                            style="width: 120px"
                    />
                </hbox>
                <hbox align="center" style="margin-top: 8px">
                    <label flex="1">Repetition Penalty</label>
                    <html:input
                            id="zctr-input-rep-penalty"
                            type="number"
                            min="1"
                            step="0.05"
                            placeholder="默认"
                            style="width: 120px"
                    />
                </hbox>
            </html:details>

            <label style="margin-top: 16px">
                <html:h3>上下文</html:h3>
            </label>
            <hbox align="center">
                <label flex="1">上下文级别</label>
                <html:select id="zctr-input-context-level" style="width: 160px">
                    <html:option value="selection">Select</html:option>
                    <html:option value="local">Local</html:option>
                    <html:option value="semantic">Semantic</html:option>
                    <html:option value="adaptive">Adaptive</html:option>
                </html:select>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <html:input
                        id="zctr-input-context-abstract"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">包含 Abstract</label>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <html:input
                        id="zctr-input-context-title"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">包含条目标题</label>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <html:input
                        id="zctr-input-context-section-title"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">包含小节标题（可用时）</label>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <html:input
                        id="zctr-input-context-adjacent"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">包含相邻段落</label>
            </hbox>
            <label style="color: #888; margin-top: 4px">
                上下文仅用于消除指代与术语歧义，不参与译文输出。
            </label>

            <label>
                <html:h3>缓存设置</html:h3>
            </label>
            <hbox align="center" style="margin-top: 8px">
                <html:input
                        id="zctr-input-cache-persist"
                        type="checkbox"
                        style="margin: 0 6px 0 0"
                />
                <label flex="1">持久化翻译缓存</label>
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <label flex="1">缓存队列长度（内存）</label>
                <html:input
                        id="zctr-input-cache-limit"
                        type="number"
                        value="50"
                        style="width: 80px"
                />
            </hbox>
            <hbox align="center" style="margin-top: 8px">
                <label flex="1">缓存队列长度（文件）</label>
                <html:input
                        id="zctr-input-cache-persist-limit"
                        type="number"
                        value="100"
                        style="width: 80px"
                />
            </hbox>
            <label style="color: #888; margin-top: 4px">
                -1 表示不限制长度（缓存不断累积可能导致运行缓慢）
            </label>
        </vbox>
    </hbox>
</groupbox>
